name: Tests
on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{matrix.operatingsystems}}
    env:
      BUILD_TYPE: ${{matrix.buildtypes}}
    strategy:  
      matrix:
        operatingsystems: [windows-latest, ubuntu-latest, macos-latest] 
        buildtypes: [Debug, Release]
    steps:
    - uses: actions/checkout@v3

    - name: Setup CI toolchain
      uses: ./.github/actions/setup-ci-toolchain

    - name: Configure CMake        
      uses: ./.github/actions/cmake-configure
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        options: -DCLX_BUILD_TESTS=ON

    - name: Build tests
      uses: ./.github/actions/cmake-build
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        targets: CelloxUnitTests CelloxIntegrationTests CelloxE2ETests CelloxFuzzTests

    - name: Run unit tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -L unit

    - name: Run integration tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -L integration

    - name: Run end-to-end tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -L e2e

    - name: Run property-fuzz tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -L fuzz

  sanitizers:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Debug
    steps:
    - uses: actions/checkout@v3

    - name: Install toolchain
      uses: ./.github/actions/setup-ci-toolchain
      with:
        linux-packages: clang cmake ninja-build

    - name: Configure CMake with sanitizers
      uses: ./.github/actions/cmake-configure
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        options: >
          -DCLX_BUILD_TESTS=ON
          -DCLX_BUILD_TOOLS=OFF
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

    - name: Build tests
      uses: ./.github/actions/cmake-build
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        targets: CelloxUnitTests CelloxIntegrationTests CelloxE2ETests CelloxFuzzTests

    - name: Run tests under sanitizers
      working-directory: ${{github.workspace}}/build
      run: |
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
        UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
        ctest -C ${{env.BUILD_TYPE}} --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Debug
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v3

    - name: Install coverage toolchain
      uses: ./.github/actions/setup-ci-toolchain
      with:
        linux-packages: gcc g++ lcov cmake ninja-build

    - name: Configure CMake with coverage flags
      uses: ./.github/actions/cmake-configure
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        options: >
          -DCLX_BUILD_TESTS=ON
          -DCLX_BUILD_TOOLS=OFF
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_FLAGS="--coverage -O0 -g"
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

    - name: Build tests
      uses: ./.github/actions/cmake-build
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        targets: CelloxUnitTests CelloxIntegrationTests CelloxE2ETests CelloxFuzzTests

    - name: Run tests for coverage
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Capture lcov report
      run: |
        lcov --capture \
          --ignore-errors mismatch \
          --directory ${{github.workspace}}/build \
          --output-file ${{github.workspace}}/coverage.info
        lcov --remove ${{github.workspace}}/coverage.info \
          '/usr/*' \
          '*/_deps/*' \
          '*/test/*' \
          --output-file ${{github.workspace}}/coverage.info

    - name: Upload coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lcov-report
        path: ${{github.workspace}}/coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ${{github.workspace}}/coverage.info
        flags: coverage
        name: cellox-lcov
        fail_ci_if_error: true