name: Build Compiler
on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{matrix.operatingsystems}}
    env:
      BUILD_TYPE: ${{matrix.buildtypes}}
    strategy:
      matrix:
        operatingsystems: [windows-latest, ubuntu-latest, macos-latest] 
        buildtypes: [Debug, Release] 
    steps:
    - uses: actions/checkout@v3

    - name: Setup CI toolchain
      uses: ./.github/actions/setup-ci-toolchain

    - name: Configure CMake
      uses: ./.github/actions/cmake-configure
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}

    - name: Building Compiler
      uses: ./.github/actions/cmake-build
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        targets: Cellox
      