name: Build Tools
on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{matrix.buildtypes}}    
    strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                buildtypes: [Debug, Release]
    steps:
    - uses: actions/checkout@v3

    - name: Setup CI toolchain
      uses: ./.github/actions/setup-ci-toolchain

    - name: Configure CMake
      uses: ./.github/actions/cmake-configure
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        options: -DCLX_BUILD_TOOLS=ON

    - name: Build compiler development tools
      uses: ./.github/actions/cmake-build
      with:
        build-dir: ${{github.workspace}}/build
        build-type: ${{env.BUILD_TYPE}}
        targets: CelloxBenchmarks CelloxDisassembler
